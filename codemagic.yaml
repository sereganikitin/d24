workflows:
  ds24-kiosk-debug:
    name: DS24 Kiosk — debug APK (dev + kiosk)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "ru.uk.ds24kiosk"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
    scripts:
      - name: Accept Android SDK licenses
        script: |
          yes | sdkmanager --licenses > /dev/null || true
      - name: Build debug APKs
        script: |
          chmod +x ./gradlew
          ./gradlew assembleDevDebug assembleKioskDebug
    artifacts:
      - app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - k959em177@gmail.com
        notify:
          success: true
          failure: true
