<!doctype html>
<!--
  Полноэкранный голосовой консьерж — второй WebView поверх основного
  (тот показывает lk.purehome.ru). Вёрстка/цвета/шрифты/SVG-персонаж
  извлечены 2026-09-12 из макета заказчика (Claude Design,
  zorge9-concierge.html) — см. план в
  C:\Users\Селедочка\.claude\plans\humble-toasting-harbor.md для полной
  спецификации и происхождения каждого значения.

  Kotlin (MainActivity.renderConcierge) вызывает
  window.DS24Concierge.render({say, hint, state, options, result})
  через evaluateJavascript при каждом шаге разговора. Клики внутри этой
  страницы (кнопка-вариант/Назад/Говорите) уходят обратно в Kotlin через
  window.ConciergeBridge (JavascriptInterface, см. MainActivity.kt).

  Если window.ConciergeBridge не задан (например, файл открыт прямо в
  обычном браузере на компьютере, не в приложении) — страница сама
  рисует демо-реплику, чтобы визуал можно было сверить с макетом без
  сборки APK вообще.

  Как и kiosk-inject.js, этот файл можно будет раздавать hot-reload'ом
  с GitHub — правки вёрстки без пересборки APK.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Manrope';
    src: url('fonts/Manrope-Variable.ttf');
    font-weight: 200 800;
    font-style: normal;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('fonts/IBMPlexMono-Regular.ttf');
    font-weight: 400;
    font-style: normal;
  }

  :root {
    --bg: #141416;
    --card: #1c1c1f;
    --card-hover: #26262a;
    --text: #f2efe9;
    --text-bright: #f7f4ee;
    --accent: #9e886f;
    --accent-light: #c0a683;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Manrope', system-ui, sans-serif;
    overflow: hidden;
  }

  .screen { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

  .topbar {
    height: 74px; padding: 0 40px; flex: none;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  .topbar img { height: 30px; width: auto; display: block; }
  .topbar-status {
    display: flex; align-items: center; gap: 28px;
    font: 400 15px/1 'Manrope', sans-serif; color: rgba(242,239,233,.45);
  }
  .topbar-divider { width: 1px; height: 16px; background: rgba(255,255,255,.12); display: block; }

  .content { flex: 1; min-height: 0; display: flex; gap: 44px; padding: 36px 40px 0; }
  .left-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 26px; overflow-y: auto; }

  .message-card {
    position: relative; background: var(--card);
    border: 1px solid rgba(158,136,111,.22); border-radius: 6px;
    padding: 28px 32px; animation: rise .35s ease both;
  }
  .message-eyebrow {
    font: 400 10px/1 'IBM Plex Mono', monospace; letter-spacing: .16em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 14px;
  }
  .message-text { font: 300 33px/1.35 'Manrope', sans-serif; color: var(--text-bright); text-wrap: pretty; }
  .message-tail {
    position: absolute; bottom: -9px; left: 52px; width: 16px; height: 16px;
    background: var(--card); transform: rotate(45deg);
    border-right: 1px solid rgba(158,136,111,.22);
    border-bottom: 1px solid rgba(158,136,111,.22);
  }

  .result-card {
    background: linear-gradient(150deg, rgba(158,136,111,.16), rgba(158,136,111,.04));
    border: 1px solid rgba(158,136,111,.32); border-radius: 6px;
    padding: 26px 30px; display: flex; flex-direction: column; gap: 16px;
    animation: rise .4s ease both;
  }
  .result-head { display: flex; align-items: center; justify-content: space-between; }
  .result-title { font: 600 20px/1 'Manrope', sans-serif; color: var(--text-bright); }
  .result-tag { font: 400 11px/1 'IBM Plex Mono', monospace; letter-spacing: .12em; color: var(--accent-light); }
  .result-lines { display: flex; flex-direction: column; gap: 11px; }
  .result-line {
    display: flex; gap: 20px; align-items: baseline; justify-content: space-between;
    border-bottom: 1px solid rgba(158,136,111,.14); padding-bottom: 10px;
  }
  .result-line-k { font: 400 15px/1.4 'Manrope', sans-serif; color: rgba(242,239,233,.5); }
  .result-line-v { font: 500 17px/1.4 'Manrope', sans-serif; color: var(--text-bright); text-align: right; }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-content: start; }
  .option-btn {
    text-align: left; cursor: pointer; background: var(--card);
    border: 1px solid rgba(255,255,255,.09); border-radius: 5px;
    padding: 22px 24px; display: flex; flex-direction: column; gap: 7px;
    font-family: 'Manrope', sans-serif; min-height: 56px;
    transition: background .18s, border-color .18s, transform .18s;
  }
  .option-btn:hover { background: var(--card-hover); border-color: rgba(158,136,111,.55); transform: translateY(-2px); }
  .option-btn:active { transform: translateY(0); }
  .option-label { font: 500 22px/1.25 'Manrope', sans-serif; color: var(--text-bright); }
  .option-sub { font: 400 15px/1.35 'Manrope', sans-serif; color: rgba(242,239,233,.45); }

  .right-col {
    width: 420px; flex: none; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  }
  .halo {
    position: absolute; bottom: 90px; width: 330px; height: 330px; border-radius: 50%;
    background: radial-gradient(circle, rgba(158,136,111,.22), transparent 68%);
    animation: halo 4s ease-in-out infinite;
  }
  .avatar-niche {
    position: relative; width: 308px; height: 480px; flex: none;
    border-radius: 154px 154px 10px 10px;
    background: linear-gradient(180deg, rgba(158,136,111,.10), rgba(158,136,111,.02));
    border: 1px solid rgba(158,136,111,.22); overflow: hidden;
    animation: sway 6s ease-in-out infinite;
  }
  .waveform { display: flex; align-items: flex-end; gap: 5px; height: 28px; flex: none; margin: 16px 0 22px; }
  .waveform span {
    width: 4px; height: 28px; border-radius: 2px; background: var(--accent);
    transform-origin: bottom; animation: bar 1.1s ease-in-out infinite;
    opacity: .25; transition: opacity .2s;
  }
  .waveform.active span { opacity: 1; }

  .bottombar {
    height: 82px; flex: none; padding: 0 40px;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,.06);
  }
  .btn-back {
    cursor: pointer; background: transparent; border: 1px solid rgba(255,255,255,.12);
    border-radius: 4px; padding: 12px 22px; font: 500 15px/1 'Manrope', sans-serif;
    color: rgba(242,239,233,.6);
  }
  .btn-back:hover { border-color: rgba(158,136,111,.6); color: var(--text-bright); }
  .hint { font: 400 15px/1 'Manrope', sans-serif; color: rgba(242,239,233,.35); }
  .btn-mic {
    cursor: pointer; display: flex; align-items: center; gap: 12px;
    background: rgba(158,136,111,.14); border: 1px solid rgba(158,136,111,.45);
    border-radius: 100px; padding: 12px 24px; font: 500 15px/1 'Manrope', sans-serif;
    color: #e8dcc9;
  }
  .btn-mic:hover { background: rgba(158,136,111,.24); }
  .btn-mic .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); display: block; }

  @keyframes bar { 0%, 100% { transform: scaleY(.25) } 50% { transform: scaleY(1) } }
  @keyframes halo { 0%, 100% { opacity: .35; transform: scale(1) } 50% { opacity: .7; transform: scale(1.06) } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1) } 96% { transform: scaleY(.08) } }
  @keyframes talk { 0%, 100% { transform: scaleY(.45) } 35% { transform: scaleY(1.2) } 65% { transform: scaleY(.75) } }
  @keyframes sway { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }

  /* Моргание идёт всегда (просто "живой" персонаж в ожидании); рот
     "говорит" — только пока реально идёт озвучка (data.state==='speaking'),
     в отличие от исходного макета, где это тоже крутилось постоянно —
     раз уж у нас есть настоящее состояние ассистента, используем его. */
  .eye { animation: blink 6s ease-in-out infinite; }
  .mouth { animation: talk 1.6s ease-in-out infinite; animation-play-state: paused; }
  .mouth.speaking { animation-play-state: running; }
</style>
</head>
<body>
<div class="screen">
  <div class="topbar">
    <img src="pure_logo.svg" alt="Pure">
    <div class="topbar-status">
      <span id="statusLocation"></span>
      <span class="topbar-divider"></span>
      <span id="statusClock"></span>
    </div>
  </div>

  <div class="content">
    <div class="left-col">
      <div class="message-card">
        <div class="message-eyebrow">Консьерж говорит</div>
        <div class="message-text" id="messageText"></div>
        <div class="message-tail"></div>
      </div>

      <div class="result-card" id="resultCard" hidden>
        <div class="result-head">
          <div class="result-title" id="resultTitle"></div>
          <div class="result-tag" id="resultTag"></div>
        </div>
        <div class="result-lines" id="resultLines"></div>
      </div>

      <div class="options" id="options"></div>
    </div>

    <div class="right-col">
      <div class="halo"></div>
      <div class="avatar-niche">
        <svg viewBox="0 0 360 560" width="308" height="480" style="display:block">
          <path d="M50 560V432c0-46 30-82 74-94l56-14 56 14c44 12 74 48 74 94v128Z" fill="#25252a"></path>
          <path d="M180 324l44 12-44 96-44-96Z" fill="#efe9df"></path>
          <path d="M180 324l-44 12c-30 8-52 28-64 54l108 170Z" fill="#1d1d21"></path>
          <path d="M180 324l44 12c30 8 52 28 64 54L180 560Z" fill="#1d1d21"></path>
          <path d="M180 356l-28-13v34l28-13 28 13v-34Z" fill="#9e886f"></path>
          <rect x="172" y="348" width="16" height="16" rx="5" fill="#c0a683"></rect>
          <rect x="163" y="302" width="34" height="46" rx="14" fill="#d0b89c"></rect>
          <circle cx="180" cy="150" r="30" fill="#17171a"></circle>
          <ellipse cx="180" cy="222" rx="66" ry="58" fill="#17171a"></ellipse>
          <ellipse cx="180" cy="248" rx="60" ry="72" fill="#e7d3ba"></ellipse>
          <ellipse cx="180" cy="204" rx="61" ry="46" fill="#17171a"></ellipse>
          <rect x="114" y="228" width="14" height="76" rx="7" fill="#17171a"></rect>
          <rect x="232" y="228" width="14" height="76" rx="7" fill="#17171a"></rect>
          <rect x="145" y="258" width="25" height="5" rx="2.5" fill="#3a2f26"></rect>
          <rect x="190" y="258" width="25" height="5" rx="2.5" fill="#3a2f26"></rect>
          <g class="eye" style="transform-box:fill-box;transform-origin:center">
            <ellipse cx="157" cy="276" rx="6.5" ry="8" fill="#2b2319"></ellipse>
            <ellipse cx="203" cy="276" rx="6.5" ry="8" fill="#2b2319"></ellipse>
          </g>
          <ellipse id="mouthShape" class="mouth" cx="180" cy="314" rx="14" ry="9" fill="#b3705f" style="transform-box:fill-box;transform-origin:center"></ellipse>
          <circle cx="132" cy="288" r="10" fill="#d8a98f" opacity=".35"></circle>
          <circle cx="228" cy="288" r="10" fill="#d8a98f" opacity=".35"></circle>
        </svg>
      </div>
      <div class="waveform" id="waveform">
        <span></span>
        <span style="animation-delay:.15s"></span>
        <span style="animation-delay:.3s;background:var(--accent-light)"></span>
        <span style="animation-delay:.45s"></span>
        <span style="animation-delay:.6s"></span>
      </div>
    </div>
  </div>

  <div class="bottombar">
    <button class="btn-back" id="btnBack">Назад</button>
    <div class="hint" id="hintText"></div>
    <button class="btn-mic" id="btnMic"><span class="dot"></span>Говорите</button>
  </div>
</div>

<script>
(function () {
  function bridge() { return window.ConciergeBridge || null; }
  function clearChildren(el) { while (el.firstChild) el.removeChild(el.firstChild); }

  function renderOptions(options) {
    var container = document.getElementById('options');
    clearChildren(container);
    if (!options || !options.length) {
      container.style.display = 'none';
      return;
    }
    container.style.display = 'grid';
    options.forEach(function (opt, index) {
      var btn = document.createElement('button');
      btn.className = 'option-btn';

      var label = document.createElement('span');
      label.className = 'option-label';
      label.textContent = opt.label || '';
      btn.appendChild(label);

      if (opt.sub) {
        var sub = document.createElement('span');
        sub.className = 'option-sub';
        sub.textContent = opt.sub;
        btn.appendChild(sub);
      }

      btn.addEventListener('click', function () {
        var b = bridge();
        if (b) b.onOption(index);
      });
      container.appendChild(btn);
    });
  }

  function renderResult(result) {
    var card = document.getElementById('resultCard');
    if (!result) {
      card.hidden = true;
      return;
    }
    card.hidden = false;
    document.getElementById('resultTitle').textContent = result.title || '';
    document.getElementById('resultTag').textContent = result.tag || '';

    var lines = document.getElementById('resultLines');
    clearChildren(lines);
    (result.lines || []).forEach(function (line) {
      var row = document.createElement('div');
      row.className = 'result-line';
      var k = document.createElement('span');
      k.className = 'result-line-k';
      k.textContent = line.k || '';
      var v = document.createElement('span');
      v.className = 'result-line-v';
      v.textContent = line.v || '';
      row.appendChild(k);
      row.appendChild(v);
      lines.appendChild(row);
    });
  }

  // Анимация персонажа (моргание/рот/индикатор) переключается отдельно
  // от render() — see MainActivity.onStateChanged, который дёргает
  // setState() при каждой смене VoiceAssistant.State, не дожидаясь
  // следующей реплики. render() сам по себе не знает про состояние,
  // только про то, ЧТО сейчас показывать (текст/кнопки/карточка).
  function applyState(state) {
    var mouth = document.getElementById('mouthShape');
    if (mouth) mouth.classList.toggle('speaking', state === 'speaking');
    var waveform = document.getElementById('waveform');
    if (waveform) waveform.classList.toggle('active', state === 'listening');
  }

  window.DS24Concierge = {
    // data: { say, hint, options: [{label, sub}], result: {title, tag, lines:[{k,v}]} | null }
    render: function (data) {
      data = data || {};
      document.getElementById('messageText').textContent = data.say || '';
      document.getElementById('hintText').textContent = data.hint || '';
      renderOptions(data.options);
      renderResult(data.result);
    },
    // state: 'idle' | 'listening' | 'thinking' | 'speaking'
    setState: function (state) {
      applyState(state);
    },
    setLocation: function (location) {
      window.__conciergeLocation = location || '';
      document.getElementById('statusLocation').textContent = window.__conciergeLocation;
    }
  };

  document.getElementById('btnBack').addEventListener('click', function () {
    var b = bridge();
    if (b) b.onBack();
  });
  document.getElementById('btnMic').addEventListener('click', function () {
    var b = bridge();
    if (b) b.onMicTap();
  });

  // Часы в шапке тикают сами на JS-стороне — не требуют обращений к
  // Kotlin на каждую минуту. Погода ("+14°" в исходном макете) пока
  // сознательно не выведена — нужен отдельный компактный источник
  // данных, см. план.
  function tickClock() {
    var now = new Date();
    var hh = String(now.getHours()).padStart(2, '0');
    var mm = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('statusClock').textContent = hh + ':' + mm;
  }
  window.DS24Concierge.setLocation('Лобби, корпус 1');
  tickClock();
  setInterval(tickClock, 15000);

  // Предпросмотр в обычном браузере на компьютере (например file://
  // прямо с диска) — без Android-моста ConciergeBridge страница сама
  // рисует демо-реплику, чтобы визуал можно было сверить с макетом, не
  // собирая APK. Внутри приложения window.ConciergeBridge всегда есть,
  // это ветка никогда не сработает на реальном киоске.
  if (!window.ConciergeBridge) {
    window.DS24Concierge.render({
      say: 'Добрый вечер. Скажите «Консьерж» или коснитесь экрана — я рядом.',
      hint: 'Помощник ждёт обращения',
      options: [{ label: 'Начать разговор', sub: 'Голосом или касанием' }],
    });
    window.DS24Concierge.setState('idle');
    // На реальном устройстве ConciergeBridge.onOption(index) вызывается
    // Kotlin'ом при тапе — тут, для предпросмотра в браузере, просто
    // логируем клик в консоль, чтобы кнопки не выглядели неработающими.
    window.ConciergeBridge = {
      onOption: function (i) { console.log('preview: onOption', i); },
      onBack: function () { console.log('preview: onBack'); },
      onMicTap: function () { console.log('preview: onMicTap'); },
    };
  }
})();
</script>
</body>
</html>
